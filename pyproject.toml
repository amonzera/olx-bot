[project]
name = "olx-monitor-local"
version = "0.1.0"
description = "Local OLX monitor that finds recent opportunities via HTTP requests."
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
