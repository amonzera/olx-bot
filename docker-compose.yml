services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: olx-monitor-local:latest
    container_name: olx_monitor_local
    environment:
      SQLITE_PATH: /app/data/olx_monitor.sqlite3
      DEBUG_DUMP_DIR: /app/data/debug_dumps
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MAX_LISTING_AGE_DAYS: ${MAX_LISTING_AGE_DAYS:-30}
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-1800}
      DELAY_BETWEEN_ALERT_REQUESTS_SECONDS: ${DELAY_BETWEEN_ALERT_REQUESTS_SECONDS:-90}
      DELAY_BETWEEN_PAGE_REQUESTS_SECONDS: ${DELAY_BETWEEN_PAGE_REQUESTS_SECONDS:-15}
      MAX_SEARCH_PAGES: ${MAX_SEARCH_PAGES:-3}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-15}
      REQUEST_RETRIES: ${REQUEST_RETRIES:-2}
      REQUEST_BACKOFF_SECONDS: ${REQUEST_BACKOFF_SECONDS:-1.5}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-30}
    volumes:
      - .:/app
      - olx_data:/app/data
    command: ["python", "-m", "src.bot.app"]

volumes:
  olx_data:
